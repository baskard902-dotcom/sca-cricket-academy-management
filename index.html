  <head>
    <script>
      (function() {
        try {
          var OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            function MockWebSocket(url, protocols) {
              var self = this;
              self.url = url;
              self.protocol = protocols || '';
              self.readyState = 1; // WebSocket.OPEN
              self.binaryType = 'blob';
              self._listeners = {};

              self.addEventListener = function(type, listener) {
                if (!self._listeners[type]) self._listeners[type] = [];
                self._listeners[type].push(listener);
              };
              self.removeEventListener = function(type, listener) {
                if (!self._listeners[type]) return;
                self._listeners[type] = self._listeners[type].filter(function(l) { return l !== listener; });
              };
              self.dispatchEvent = function(evt) {
                var list = self._listeners[evt.type] || [];
                list.forEach(function(l) { try { l.call(self, evt); } catch(e){} });
                return true;
              };
              self.send = function() {};
              self.close = function() {
                self.readyState = 3;
              };

              // Vite expects an 'open' event when connection succeeds
              setTimeout(function() {
                if (typeof self.onopen === 'function') {
                  try { self.onopen(new Event('open')); } catch(e) {}
                }
                self.dispatchEvent(new Event('open'));
              }, 10);
            }

            MockWebSocket.CONNECTING = 0;
            MockWebSocket.OPEN = 1;
            MockWebSocket.CLOSING = 2;
            MockWebSocket.CLOSED = 3;

            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                !protocols ||
                (typeof url === 'string' && (url.indexOf('ais-dev') !== -1 || url.indexOf('run.app') !== -1 || url.indexOf('localhost') !== -1))
              ) {
                return new MockWebSocket(url, protocols);
              }
              return new OriginalWebSocket(url, protocols);
            };

            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          // Suppress unhandled promise rejections originating from WebSocket connections
          window.addEventListener('unhandledrejection', function(e) {
            var reasonStr = '';
            try {
              reasonStr = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
            } catch (err) {}
            if (reasonStr && (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('closed without opened') !== -1)) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);

          // Suppress general error events matching websocket failure
          window.addEventListener('error', function(e) {
            var msg = (e && e.message) ? String(e.message) : '';
            if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1)) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);

          // Filter console.error logs for Vite WebSocket disconnection
          var origConsoleError = console.error;
          console.error = function() {
            var combined = '';
            try {
              for (var i = 0; i < arguments.length; i++) {
                var arg = arguments[i];
                if (typeof arg === 'string') combined += ' ' + arg;
                else if (arg && arg.message) combined += ' ' + arg.message;
                else combined += ' ' + String(arg);
              }
            } catch (err) {}
            if (combined.indexOf('failed to connect to websocket') !== -1 || combined.indexOf('WebSocket closed without opened') !== -1) {
              return; // Suppress harmless Vite dev WebSocket noise
            }
            origConsoleError.apply(console, arguments);
          };
        } catch (err) {}
      })();
    </script>
